[tool.poetry]
name = "akadze"
version = "0.1.1"
description = "Postgres-backed task queue. The broker is PostgreSQL."
authors = ["g4st3r"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/g4st3r-d3v/akadze"
repository = "https://github.com/g4st3r-d3v/akadze"
packages = [{ include = "akadze" }]
include = ["akadze/sql/*.sql"]
keywords = ["postgres", "queue", "worker", "tasks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
asyncpg = ">=0.30.0,<1.0.0"
pydantic = "^2.10.0"
croniter = "^6.0.0"
sqlalchemy = {version = "^2.0.40", extras = ["asyncio"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[tool.poetry.scripts]
akadze = "akadze.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["akadze"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
